name: Report a problem
description: Something was hidden that shouldn't be, something wasn't hidden, or a page sent you to the wrong place.
title: "Problem: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep MarketplaceOnly working. If you used **Report a problem** in the extension, the details at the bottom are already filled in.

        **Please don't include** links to Facebook pages, people's names, or screenshots that show personal details. This report is public.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you see, and what were you trying to do?
      placeholder: e.g. "The Groups icon still shows in the top bar" or "Clicking a seller's name sent me to Marketplace"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: e.g. "The Groups icon to be hidden"
    validations:
      required: false
  - type: input
    id: page_type
    attributes:
      label: Page type
      description: The kind of page, not its address. e.g. Marketplace listing, profile or Page, Feed.
    validations:
      required: true
  - type: input
    id: couldnt_find
    attributes:
      label: Rules showing "Couldn't find it"
      description: Filled in by the extension. Leave as is.
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 141 or Firefox 144
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MarketplaceOnly version
      description: Shown at the bottom of the tray.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I've removed links, names, and anything personal from this report.
          required: true
